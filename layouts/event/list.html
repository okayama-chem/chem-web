{{ define "main" }}

<!-- events -->
<section class="section">
  <div class="container">
    <div class="row">
      <!-- event -->
      {{ $now := now }}
      {{ range .Data.Pages }}
        {{ $include := true }}
        {{ with .Params.expireDate }}
          {{ $include = ge (time.AsTime .) $now }}
        {{ end }}
        {{ if $include }}
        <div class="col-lg-4 col-sm-6 mb-5">
          {{ .Render "event" }}
        </div>
        {{ end }}
      {{ end }}
    </div>
  </div>
</section>
<!-- /events -->

{{ end }}
